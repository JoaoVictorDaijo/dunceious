name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. successive pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Each gate runs even if an earlier one fails, so a single CI run
      # surfaces every failure at once. The job still fails if any gate fails.
      - name: Type-check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: License headers
        if: ${{ !cancelled() }}
        run: npm run lint:headers

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
