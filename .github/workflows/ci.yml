name: CI

on:
  pull_request:
    branches: [main, develop]
  # develop is not listed: every develop commit arrives through a PR that this
  # workflow already gated, and the develop -> main promotion PR re-runs it.
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. successive pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Each gate runs even if an earlier one fails, so a single CI run
      # surfaces every failure at once. The job still fails if any gate fails.
      - name: Type-check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: License headers
        if: ${{ !cancelled() }}
        run: npm run lint:headers

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No worker cap: the runner is a dedicated VM, unlike a shared dev machine.
      - name: Test
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser e2e on production build
        run: npm run test:e2e:run

      - name: Upload browser failure results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  local-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild local alignment engine and SSW score module
        run: bash scripts/build-local-engine.sh public/wasm/local-align.rebuilt.wasm public/wasm/local-align-ssw.rebuilt.wasm

      - name: Require reproducible artifacts below 25 MiB
        run: |
          for name in local-align local-align-ssw; do
            cmp "public/wasm/$name.wasm" "public/wasm/$name.rebuilt.wasm"
            test "$(wc -c < "public/wasm/$name.wasm")" -lt 26214400
          done

  # Branch protection requires a check named "ci"; this job carries that name
  # so the parallel jobs above can be renamed or split without touching it.
  ci:
    if: ${{ always() }}
    needs: [static, test, e2e, local-engine]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::A required CI job did not succeed."; exit 1; }
          done

  # Promotions to main must carry a version bump (see CLAUDE.md > Versioning
  # & releases). Runs only on develop -> main PRs; never nags develop PRs.
  version-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      # A promotion must STRICTLY INCREASE the version (a real bump, not merely a
      # change): catches both a forgotten bump and a downgrade/typo. Version
      # strings come from package.json (base = main, head = this PR) and are only
      # ever passed to node as argv or logged JSON-quoted, so a crafted value
      # can't inject a workflow command.
      - name: Require a version increase vs main
        run: |
          git show FETCH_HEAD:package.json > /tmp/base-package.json
          node -e '
            const fs = require("node:fs");
            const ver = p => JSON.parse(fs.readFileSync(p, "utf8")).version;
            const base = ver("/tmp/base-package.json");
            const head = ver("./package.json");
            console.log(`main: ${JSON.stringify(base)}  PR: ${JSON.stringify(head)}`);
            const parse = v => String(v).split("-")[0].split(".").map(Number);
            const [a, b] = [parse(head), parse(base)];
            const cmp = a.map((x, i) => x - (b[i] || 0)).find(d => d !== 0) || 0;
            if (cmp > 0) { console.log("Version increased."); process.exit(0); }
            console.log("::error::Version must strictly increase on a develop->main promotion. Bump package.json (npm run version:{patch,minor,major}) and update CHANGELOG.md — see CLAUDE.md > Versioning & releases.");
            process.exit(1);
          '
