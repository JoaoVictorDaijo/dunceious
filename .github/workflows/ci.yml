name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. successive pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Each gate runs even if an earlier one fails, so a single CI run
      # surfaces every failure at once. The job still fails if any gate fails.
      - name: Type-check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: License headers
        if: ${{ !cancelled() }}
        run: npm run lint:headers

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  # Promotions to main must carry a version bump (see CLAUDE.md > Versioning
  # & releases). Runs only on develop -> main PRs; never nags develop PRs.
  version-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Require a version bump vs main
        run: |
          git show FETCH_HEAD:package.json > /tmp/base-package.json
          base_ver=$(node -p "require('/tmp/base-package.json').version")
          head_ver=$(node -p "require('./package.json').version")
          echo "main package.json: $base_ver"
          echo "PR   package.json: $head_ver"
          if [ "$head_ver" = "$base_ver" ]; then
            echo "::error::Version $head_ver is unchanged from main. Bump package.json (npm run version:{patch,minor,major}) and update CHANGELOG.md before promoting — see CLAUDE.md > Versioning & releases."
            exit 1
          fi
          echo "Version bumped $base_ver -> $head_ver"
